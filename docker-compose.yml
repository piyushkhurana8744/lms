# Set DOMAIN=lms.bubududuworld.fun in .env — edge-register maps it on veblika-edge
# and issues Let's Encrypt SSL automatically on docker compose up -d --build.
#
# Port map (do not collide with other stacks):
#   broadcastingengine → 8090
#   chatbotengine      → 8091
#   aicallingengine    → 8092
#   webinarengine      → 8093
#   dripengine         → 8094
#   vb-channel-hub     → 8100
#   creator-growth-ai  → 5011
#   lms                → 5012

name: lms

services:
  # ── MongoDB (replica-set for transactions / change-streams) ──────────────────
  mongodb:
    image: mongo:${MONGO_VERSION:-7.0}
    container_name: lms-mongodb
    restart: unless-stopped
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all', '--wiredTigerCacheSizeGB', '1']
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-edtech_lms}
    volumes:
      - lms-mongo:/data/db
    networks: [lms]
    healthcheck:
      test:
        - CMD-SHELL
        - >
          mongosh --quiet --eval
          "try { const s = rs.status(); if (s.ok && s.myState === 1) { quit(0) } quit(1) }
          catch (e) { try { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}) } catch (e2) {} quit(1) }"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: lms-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - lms-redis:/data
    networks: [lms]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── API ──────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: lms-api
    restart: unless-stopped
    env_file: [.env]
    environment: &lms-env
      NODE_ENV: production
      PORT: '4000'
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/edtech_lms?replicaSet=rs0}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      API_INTERNAL_URL: http://api:4000
    expose: ['4000']
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks: [lms]

  # ── Background Worker ─────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: lms-worker
    restart: unless-stopped
    env_file: [.env]
    environment:
      <<: *lms-env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks: [lms]

  # ── Next.js Web ───────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: lms-web
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
      NEXT_PUBLIC_API_URL: ''
    expose: ['3000']
    depends_on:
      - api
    networks: [lms]

  # ── Nginx (internal router, published on host :5012) ─────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: lms-nginx
    restart: unless-stopped
    ports:
      - '${LMS_HOST_PORT:-5012}:80'
    volumes:
      - ./deploy/nginx/lms.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    networks: [lms]

  # ── Edge Register (auto SSL + domain mapping on veblika-edge) ─────────────────
  # Runs once on `docker compose up`. Writes nginx vhost to /etc/veblika/edge/tenants/
  # and issues a Let's Encrypt cert for DOMAIN. Requires DOMAIN set in .env.
  edge-register:
    image: docker:27-cli
    container_name: lms-edge-register
    env_file: [.env]
    environment:
      EDGE_DIR: /etc/veblika/edge
      EDGE_CONTAINER_NAME: ${EDGE_CONTAINER_NAME:-veblika-edge}
      LMS_HOST_PORT: ${LMS_HOST_PORT:-5012}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/veblika/edge:/etc/veblika/edge
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/lib/letsencrypt:/var/lib/letsencrypt
      - /var/www/certbot:/var/www/certbot
      - /var/www/html:/var/www/html
      - ./deploy/register-edge-domain.sh:/register-edge-domain.sh:ro
    entrypoint: ['sh', '/register-edge-domain.sh']
    depends_on:
      - nginx
    restart: 'on-failure'
    network_mode: host

volumes:
  lms-mongo:
  lms-redis:

networks:
  lms:
    name: lms-net
    driver: bridge
