services:
  mongodb:
    image: mongo:${MONGO_VERSION:-7.0}
    container_name: didm-lms-mongodb
    restart: always
    ports:
      - '${MONGO_PORT:-27017}:27017'
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    environment:
      MONGO_INITDB_DATABASE: edtech_lms
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ ping: 1 }).ok']
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-replica-init:
    image: mongo:${MONGO_VERSION:-7.0}
    restart: 'no'
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongodb:27017 --quiet --eval '
          try { rs.status() }
          catch (error) {
            rs.initiate({_id:"rs0",members:[{_id:0,host:"mongodb:27017"}]})
          }
        '

  redis:
    image: redis:${REDIS_VERSION:-7.2-alpine}
    container_name: didm-lms-redis
    restart: always
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: didm-lms-api
    restart: always
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGO_URI: mongodb://mongodb:27017/edtech_lms?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:3000
      INTERNAL_WORKER_SECRET: development-worker-secret
    depends_on:
      mongo-replica-init:
        condition: service_completed_successfully
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: didm-lms-worker
    restart: always
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://mongodb:27017/edtech_lms?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      INTERNAL_WORKER_SECRET: development-worker-secret
      API_INTERNAL_URL: http://api:4000
    depends_on:
      - redis
      - mongodb

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: didm-lms-web
    restart: always
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api

volumes:
  mongo_data:
  redis_data:
