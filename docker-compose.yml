# Shared veblika-edge packaging — LMS platform.
# Coexists with other stacks on the same host via shared edge-network.
# GATEWAY_ALIAS is injected by the master-panel deploy orchestrator.
#
# Host port map (published by the internal nginx gateway on edge-network):
#   lms-api      → internal :4000 (not published to host)
#   lms-web      → internal :3000 (not published to host)
#   lms-worker   → internal only (no HTTP)
#   gateway      → edge-network (veblika-edge proxies HTTPS via GATEWAY_ALIAS)
#
# MongoDB replica-set is required for transactions / change-streams.

name: lms

services:
  # ── MongoDB (replica-set for transactions) ───────────────────────────────────
  mongodb:
    image: mongo:${MONGO_VERSION:-7.0}
    container_name: lms-mongodb
    restart: unless-stopped
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all', '--wiredTigerCacheSizeGB', '1']
    environment:
      MONGO_INITDB_DATABASE: edtech_lms
    volumes:
      - lms-mongo:/data/db
    networks: [internal]
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s

  # One-shot: initialise replica-set on first boot, no-op on subsequent restarts.
  mongo-replica-init:
    image: mongo:${MONGO_VERSION:-7.0}
    restart: 'no'
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongodb:27017 --quiet --eval '
          try { rs.status() }
          catch (_) {
            rs.initiate({_id:"rs0",members:[{_id:0,host:"mongodb:27017"}]})
          }
        '
    networks: [internal]

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: lms-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - lms-redis:/data
    networks: [internal]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── API ──────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: lms-api
    restart: unless-stopped
    env_file: [.env]
    environment: &lms-env
      NODE_ENV: production
      PORT: '4000'
      MONGO_URI: mongodb://mongodb:27017/edtech_lms?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      API_INTERNAL_URL: http://api:4000
    expose: ['4000']
    depends_on:
      mongo-replica-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      internal:
        aliases:
          - ${GATEWAY_ALIAS:-lms-gateway}-api

  # ── Background Worker ─────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: lms-worker
    restart: unless-stopped
    env_file: [.env]
    environment:
      <<: *lms-env
    depends_on:
      mongo-replica-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks: [internal]

  # ── Next.js Web ──────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: lms-web
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
      # NEXT_PUBLIC_API_URL is intentionally empty in production:
      # the gateway routes /api/v1/* → api container directly.
      NEXT_PUBLIC_API_URL: ''
    expose: ['3000']
    depends_on:
      - api
    networks:
      internal:
        aliases:
          - ${GATEWAY_ALIAS:-lms-gateway}-frontend

  # ── Nginx Gateway ─────────────────────────────────────────────────────────────
  # Sits on edge-network so veblika-edge can reach it by GATEWAY_ALIAS.
  # Routes: /api/v1/* → api, /socket.io/* → api, /uploads/* → api, / → web.
  gateway:
    image: nginx:1.27-alpine
    container_name: lms-gateway
    restart: unless-stopped
    depends_on:
      - api
      - web
    environment:
      - GATEWAY_ALIAS=${GATEWAY_ALIAS:-lms-gateway}
    volumes:
      - ./deploy/nginx/templates/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - internal
      - edge-network

volumes:
  lms-mongo:
  lms-redis:

networks:
  internal:
    driver: bridge
  edge-network:
    external: true
